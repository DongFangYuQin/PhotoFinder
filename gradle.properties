# ============================================================
#  这个项目的编译设置
#  说明：这个文件里**不能放任何密钥**，因为它会一起上传到 GitHub。
#        密钥要在手机的 App 里填（存在手机本地）。
# ============================================================

# 给编译过程分配的内存上限。
# 如果编译时报"内存不足"，把 3072 调小一点（比如 2048）。
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# 让编译过程把中间结果缓存起来，第二次编译会快很多
org.gradle.caching=true

# 让多个模块并行编译
org.gradle.parallel=true

# Kotlin 官方代码风格
kotlin.code.style=official

# 安卓项目必须开这个
android.useAndroidX=true

# 只打包用到的资源，减小安装包体积
android.nonTransitiveRClass=true

# ⚠️ 这一行是"绕过检查"的开关。
# 原因：如果项目所在的文件夹名含中文，安卓编译插件默认会拒绝编译，
#       认为中文路径在 Windows 上可能出问题。这里强行让它继续。
# 如果编译时出现奇怪的"找不到文件"错误，或者你把项目挪到了纯英文路径，
# 这一行就可以删掉。
android.overridePathCheck=true

# ⚠️ 这一行也是"绕过检查"的开关。
# 原因：安卓编译插件 9.x 内置了 Kotlin 支持，而数据库工具（KSP/Room）
#       还是用老方式把自动生成的代码加进项目，两者会吵架。
#       官方报错里明确给了这个开关，就先开着。
android.disallowKotlinSourceSets=false

# ------------------------------------------------------------
# 注意：Gradle 的下载缓存目录建议用系统环境变量 GRADLE_USER_HOME 指定，
# 这样所有项目共用一份缓存（默认在用户目录下）。
# **不要**在这里再写一遍，否则容易和 Android Studio 的设置打架。
# ------------------------------------------------------------

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
